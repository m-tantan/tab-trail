<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rename tab</title>
    <link rel="stylesheet" href="rename.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">Tab Trail</p>
      <h1>Rename current tab</h1>
      <p id="current-title" class="current-title"></p>
      <p id="sleeping-note" class="current-title" hidden>
        This tab is sleeping. Its saved name will appear in Tab Trail now and on the page when it wakes.
      </p>
      <form id="rename-form">
        <label for="tab-name">Custom tab name</label>
        <input id="tab-name" maxlength="120" autocomplete="off">
        <div class="button-row">
          <button class="primary" type="submit">Rename</button>
          <button id="reset-name" class="secondary" type="button">Reset</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="rename.js"></script>
  </body>
</html>
