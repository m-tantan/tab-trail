<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Trail</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Tab Trail</p>
          <h1>Rename and retrace</h1>
        </div>
        <button id="shortcuts-button" class="icon-button" title="Configure shortcuts" type="button">
          &#9881;
        </button>
      </header>

      <section aria-labelledby="rename-heading">
        <h2 id="rename-heading">Current tab name</h2>
        <form id="rename-form">
          <label class="sr-only" for="tab-name">Custom tab name</label>
          <input id="tab-name" maxlength="120" placeholder="Enter a custom name" autocomplete="off">
          <div class="button-row">
            <button class="primary" type="submit">Rename</button>
            <button id="reset-name" class="secondary" type="button">Reset</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="history-heading">
        <div class="section-heading">
          <h2 id="history-heading">Active-tab history</h2>
          <span>20 max</span>
        </div>
        <div class="button-row">
          <button id="history-back" class="secondary navigation" type="button">
            <span aria-hidden="true">&larr;</span> Back
          </button>
          <button id="history-forward" class="secondary navigation" type="button">
            Forward <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
        <ol id="history-list" reversed></ol>
        <p id="empty-history" class="muted" hidden>No previous tabs in this window yet.</p>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
