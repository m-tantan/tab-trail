<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Trail</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Tab Trail</p>
          <h1>Retrace your tabs</h1>
        </div>
        <button id="shortcuts-button" class="icon-button" title="Settings and shortcuts"
                aria-label="Settings and shortcuts" type="button">
          &#9881;
        </button>
      </header>

      <section id="reload-notice" aria-labelledby="reload-heading" role="status" hidden>
        <h2 id="reload-heading">Reload needed</h2>
        <p class="muted">Reload Tab Trail to load the updated copy command and shortcuts.
          This popup will close; reopen it afterward.</p>
        <button id="reload-extension" class="secondary" type="button">Reload extension</button>
      </section>

      <label class="search-label" for="tab-search">Search all open tabs</label>
      <input id="tab-search" type="search" placeholder="Name, title, or URL" autocomplete="off"
             aria-describedby="search-hint" autofocus>
      <p id="search-hint" class="muted">Includes sleeping tabs. Use arrow keys and Enter to switch.</p>

      <section aria-labelledby="history-heading">
        <div class="section-heading">
          <h2 id="history-heading">Active-tab history</h2>
          <span id="result-count" role="status" aria-live="polite"></span>
        </div>
        <div class="button-row">
          <button id="history-back" class="secondary navigation" type="button" disabled>
            <span aria-hidden="true">&larr;</span> Back
          </button>
          <button id="history-forward" class="secondary navigation" type="button" disabled>
            Forward <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
        <ol id="history-list" reversed></ol>
        <p id="empty-history" class="muted" hidden></p>
      </section>

      <button id="copy-selected-tabs" class="secondary copy-tabs" type="button" disabled
              title="Copy URLs of tabs selected in the browser's tab strip">
        Copy selected tab links
      </button>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="extension-version" class="muted"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
