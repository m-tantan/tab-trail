<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Trail popup preview</title>
    <link rel="stylesheet" href="../popup.css">
    <style>
      html {
        color: #172033;
        background: #f5f7fb;
      }

      body {
        width: 436px;
        padding: 18px;
      }

      body > main {
        width: 400px;
        color: #172033;
        border: 1px solid #d9deea;
        border-radius: 16px;
        background: #f5f7fb;
        box-shadow: 0 18px 45px rgb(27 39 66 / 18%);
      }

      section {
        border-color: #d9deea;
        background: #ffffff;
      }

      .secondary,
      .icon-button {
        color: #27324a;
        background: #edf0f6;
      }

      .history-item {
        color: #27324a;
      }

      .history-item.current {
        color: #244bc5;
        background: #eaf0ff;
      }

      .favicon-placeholder.blue {
        background: #315bea;
      }

      .favicon-placeholder.green {
        background: #28b79f;
      }

      .favicon-placeholder.orange {
        background: #f59e0b;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Tab Trail</p>
          <h1>Retrace your tabs</h1>
        </div>
        <button class="icon-button" title="Settings and shortcuts"
                aria-label="Settings and shortcuts" type="button">&#9881;</button>
      </header>

      <label class="search-label" for="tab-search">Search all open tabs</label>
      <input id="tab-search" type="search" placeholder="Name, title, or URL" autocomplete="off">
      <p id="search-hint" class="muted">Includes sleeping tabs. Use arrow keys and Enter to switch.</p>

      <section aria-labelledby="history-heading">
        <div class="section-heading">
          <h2 id="history-heading">Active-tab history</h2>
          <span>3 / 20</span>
        </div>
        <div class="button-row">
          <button class="secondary navigation" type="button">&larr; Back</button>
          <button class="secondary navigation" type="button">Forward &rarr;</button>
        </div>
        <ol>
          <li class="history-row">
            <button class="history-item current" type="button">
              <span class="favicon-placeholder green"></span>
              <span class="tab-details">
                <span class="tab-title">Release dashboard</span>
                <span class="tab-url">github.com</span>
              </span>
            </button>
            <button class="rename-button secondary" type="button">Rename</button>
          </li>
          <li class="history-row">
            <button class="history-item" type="button">
              <span class="favicon-placeholder blue"></span>
              <span class="tab-details">
                <span class="tab-title">Tab M · Investigation notes</span>
                <span class="tab-url">dev.azure.com · Other window</span>
              </span>
            </button>
            <button class="rename-button secondary" type="button">Rename</button>
          </li>
          <li class="history-row">
            <button class="history-item" type="button">
              <span class="favicon-placeholder orange"></span>
              <span class="tab-details">
                <span class="tab-title">Architecture reference</span>
                <span class="tab-url">learn.microsoft.com · Sleeping</span>
              </span>
            </button>
            <button class="rename-button secondary" type="button">Rename</button>
          </li>
        </ol>
      </section>

      <button class="secondary copy-tabs" type="button">Copy selected tab links</button>
      <p id="status" role="status">History spans windows in this browser profile.</p>
      <p id="extension-version" class="muted">Loaded version 1.3.2</p>
    </main>
  </body>
</html>
